<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qubee Afaan Oromoo Baradhu</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            margin: 0;
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 550px;
            width: 100%;
            border: 4px solid #ffffff;
        }

        h2 { 
            color: #1a237e; 
            margin-bottom: 5px;
            font-size: 26px;
        }

        p { 
            color: #555555; 
            margin-bottom: 25px; 
            font-size: 15px;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 15px; 
        }

        .btn { 
            color: white; 
            border: 2px solid rgba(255, 255, 255, 0.8); 
            padding: 18px 0; 
            font-size: 22px; 
            font-weight: bold; 
            border-radius: 14px; 
            cursor: pointer; 
            transition: all 0.2s ease-in-out; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12);
        }

        .btn:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25); 
            filter: brightness(1.15);
        }

        .btn:active {
            transform: translateY(1px);
        }

        @media (max-width: 480px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
            .container { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Qubee Afaan Oromoo Baradhu</h2>
        <p>Qubee tokko tokko xuqii sagalee dhaggeeffadhu!</p>
        <div class="grid" id="alphabetGrid"></div>
    </div>

    <script>
        const qubeewwan = [
            {q: "A", s: "audio/a.mp3"}, {q: "B", s: "audio/b.mp3"}, {q: "C", s: "audio/c.mp3"},
            {q: "CH", s: "audio/ch.mp3"}, {q: "D", s: "audio/d.mp3"}, {q: "DH", s: "audio/dh.mp3"},
            {q: "E", s: "audio/e.mp3"}, {q: "F", s: "audio/f.mp3"}, {q: "G", s: "audio/g.mp3"},
            {q: "H", s: "audio/h.mp3"}, {q: "I", s: "audio/i.mp3"}, {q: "J", s: "audio/j.mp3"},
            {q: "K", s: "audio/k.mp3"}, {q: "L", s: "audio/l.mp3"}, {q: "M", s: "audio/m.mp3"},
            {q: "N", s: "audio/n.mp3"}, {q: "NY", s: "audio/ny.mp3"}, {q: "O", s: "audio/o.mp3"},
            {q: "P", s: "audio/p.mp3"}, {q: "PH", s: "audio/ph.mp3"}, {q: "Q", s: "audio/q.mp3"},
            {q: "R", s: "audio/r.mp3"}, {q: "S", s: "audio/s.mp3"}, {q: "SH", s: "audio/sh.mp3"},
            {q: "T", s: "audio/t.mp3"}, {q: "U", s: "audio/u.mp3"}, {q: "V", s: "audio/v.mp3"},
            {q: "W", s: "audio/w.mp3"}, {q: "X", s: "audio/x.mp3"}, {q: "Y", s: "audio/y.mp3"},
            {q: "Z", s: "audio/z.mp3"}
        ];

        // Tarree halluwwan miidhagoo (Color Palette)
        const colors = [
            "#D32F2F", "#C2185B", "#7B1FA2", "#512DA8", 
            "#303F9F", "#1976D2", "#0288D1", "#0097A7", 
            "#00796B", "#388E3C", "#689F38", "#AFB42B", 
            "#FBC02D", "#FFA000", "#F57C00", "#E64A19"
        ];

        const grid = document.getElementById("alphabetGrid");

        qubeewwan.forEach((item, index) => {
            const button = document.createElement("button");
            button.className = "btn";
            button.innerText = item.q;
            
            // Button tokkoon tokkoon isaaniif halluu addaa kennuu
            button.style.backgroundColor = colors[index % colors.length];

            button.onclick = () => {
                let audio = new Audio(item.s);
                audio.play();
            };
            grid.appendChild(button);
        });
    </script>

</body>
</html>
